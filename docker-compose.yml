services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: familyvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: familyvault
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_URL: postgresql+psycopg2://familyvault:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/familyvault
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FAMILYVAULT_MASTER_KEY: ${FAMILYVAULT_MASTER_KEY:?Set FAMILYVAULT_MASTER_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_PATH: /data/storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    depends_on:
      - postgres
    ports:
      - '8000:8000'
    volumes:
      - medical_storage:/data/storage

volumes:
  pg_data:
  medical_storage:
